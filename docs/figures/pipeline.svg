<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Manrope, Inter, system-ui, sans-serif">
  <title>EgoVersa-Sim pipeline: MuJoCo as an exact verifier for data, evaluation and simulator-verified RL</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C87FF"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0B866"/></marker>
  </defs>
  <rect width="1200" height="520" rx="22" fill="#0A0E22"/>
  <text x="40" y="52" fill="#E9ECFF" font-size="24" font-weight="700">EgoVersa-Sim</text>
  <text x="40" y="78" fill="#A0A8D4" font-size="14">The simulator is the verifier: every label, every reward and every "imagined" view comes from MuJoCo state, not from a learned model.</text>

  <!-- column 1: scene -->
  <g transform="translate(40,110)">
    <rect width="250" height="360" rx="16" fill="#131A3B" stroke="#2A3368"/>
    <text x="20" y="34" fill="#E9ECFF" font-size="16" font-weight="700">1  Seeded physical scene</text>
    <text x="20" y="62" fill="#A0A8D4" font-size="13">6–9 objects dropped, stacked,</text>
    <text x="20" y="80" fill="#A0A8D4" font-size="13">settled under gravity (MuJoCo 3.16)</text>
    <g transform="translate(0,52)">
    <rect x="30" y="110" width="190" height="16" rx="3" fill="#8a6a4f"/>
    <rect x="44" y="126" width="8" height="70" fill="#3b4060"/><rect x="198" y="126" width="8" height="70" fill="#3b4060"/>
    <rect x="70" y="80" width="34" height="30" rx="3" fill="#E5484D"/><rect x="74" y="58" width="26" height="22" rx="3" fill="#F2C94C"/>
    <circle cx="150" cy="98" r="12" fill="#F2762A"/>
    <rect x="172" y="72" width="22" height="38" rx="3" fill="#1FB8A6"/><rect x="174" y="62" width="18" height="10" rx="2" fill="#5CE1E6"/>
    </g>
    <text x="20" y="270" fill="#E9ECFF" font-size="13" font-weight="600">Exact state</text>
    <text x="20" y="289" fill="#A0A8D4" font-size="12.5">poses, contacts, contact forces,</text>
    <text x="20" y="306" fill="#A0A8D4" font-size="12.5">segmentation and depth renders,</text>
    <text x="20" y="323" fill="#A0A8D4" font-size="12.5">forward rollouts after removal,</text>
    <text x="20" y="340" fill="#A0A8D4" font-size="12.5">each robot's head camera</text>
  </g>
  <path d="M300 290 H345" stroke="#7C87FF" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- column 2: verifier -->
  <g transform="translate(355,110)">
    <rect width="250" height="360" rx="16" fill="#131A3B" stroke="#2A3368"/>
    <text x="20" y="34" fill="#E9ECFF" font-size="16" font-weight="700">2  Exact verifier</text>
    <g font-size="12.5">
      <rect x="20" y="56" width="210" height="44" rx="10" fill="#0E1330" stroke="#3A4585"/><text x="34" y="76" fill="#5CE1E6" font-weight="600">Camera frame</text><text x="34" y="92" fill="#A0A8D4">left/right, depth, height</text>
      <rect x="20" y="108" width="210" height="44" rx="10" fill="#0E1330" stroke="#3A4585"/><text x="34" y="128" fill="#5CE1E6" font-weight="600">Robot frame + facing</text><text x="34" y="144" fill="#A0A8D4">perspective taking (θ)</text>
      <rect x="20" y="160" width="210" height="44" rx="10" fill="#0E1330" stroke="#3A4585"/><text x="34" y="180" fill="#5CE1E6" font-weight="600">Visibility</text><text x="34" y="196" fill="#A0A8D4">modal / amodal pixels</text>
      <rect x="20" y="212" width="210" height="44" rx="10" fill="#0E1330" stroke="#F0B866"/><text x="34" y="232" fill="#F0B866" font-weight="600">Support</text><text x="34" y="248" fill="#A0A8D4">normal contact forces</text>
      <rect x="20" y="264" width="210" height="44" rx="10" fill="#0E1330" stroke="#F0B866"/><text x="34" y="284" fill="#F0B866" font-weight="600">What if removed?</text><text x="34" y="300" fill="#A0A8D4">simulated 1.2 s rollout</text>
    </g>
    <text x="20" y="338" fill="#6B74A6" font-size="12">ties and hidden objects excluded</text>
  </g>
  <path d="M615 200 H660" stroke="#7C87FF" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M615 380 H660" stroke="#F0B866" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- column 3: uses -->
  <g transform="translate(670,110)">
    <rect width="490" height="170" rx="16" fill="#131A3B" stroke="#2A3368"/>
    <text x="20" y="34" fill="#E9ECFF" font-size="16" font-weight="700">3a  Evaluation with a perception control</text>
    <text x="20" y="62" fill="#A0A8D4" font-size="13">Same question twice: the scene only, and the scene plus the robot's true view.</text>
    <rect x="20" y="82" width="120" height="66" rx="8" fill="#1C2450"/><text x="80" y="120" fill="#A0A8D4" font-size="12" text-anchor="middle">scene view</text>
    <text x="158" y="120" fill="#E9ECFF" font-size="20">+</text>
    <rect x="182" y="82" width="120" height="66" rx="8" fill="#1C2450" stroke="#5CE1E6"/><text x="242" y="120" fill="#5CE1E6" font-size="12" text-anchor="middle">robot's eyes</text>
    <text x="320" y="104" fill="#E9ECFF" font-size="13" font-weight="600">paired McNemar test</text>
    <text x="320" y="124" fill="#A0A8D4" font-size="12.5">perception vs reasoning</text>
  </g>
  <g transform="translate(670,300)">
    <rect width="490" height="170" rx="16" fill="#131A3B" stroke="#2A3368"/>
    <text x="20" y="34" fill="#E9ECFF" font-size="16" font-weight="700">3b  SV-GRPO for a 1B student</text>
    <text x="20" y="62" fill="#A0A8D4" font-size="13">Qwen3.5-0.8B + LoRA, group-relative policy optimisation; rewards come from code:</text>
    <g font-size="12.5">
      <text x="20" y="92" fill="#E9ECFF">• answer</text><text x="130" y="92" fill="#A0A8D4">matches the simulator label</text>
      <text x="20" y="112" fill="#E9ECFF">• abstain</text><text x="130" y="112" fill="#A0A8D4">penalise claims about hidden objects</text>
      <text x="20" y="132" fill="#F0B866">• process</text><text x="130" y="132" fill="#A0A8D4">stated reference frame checked exactly</text>
      <text x="20" y="152" fill="#F0B866">• consistency</text><text x="130" y="152" fill="#A0A8D4">label-free agreement across camera views</text>
    </g>
  </g>
</svg>
