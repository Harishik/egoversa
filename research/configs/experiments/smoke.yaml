# CPU-feasible end-to-end check of the training code on the smoke dataset.
name: smoke
kind: train
track: permissive
dataset: research/data/egoversa-smoke
train_files: [sft/train.jsonl]
val_file: sft/val.jsonl
purpose: "Prove the pipeline runs: processor, image tokens, label mask, LoRA, optimiser, eval, checkpoint."
model: { hf_id: Qwen/Qwen3.5-0.8B }
lora: { r: 8, alpha: 8, dropout: 0.0, finetune_vision: false, finetune_language: true }
train: { epochs: 1, lr: 2.0e-4, batch_size: 1, grad_accum: 2, eval_every: 2, eval_examples: 4, seed: 3407 }
